name: QA Screenshot

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build QA configuration (Simulator)
        run: |
          xcodebuild \
            -project MochiAI.xcodeproj \
            -scheme MochiAI \
            -configuration QA \
            -sdk iphonesimulator \
            -derivedDataPath build-qa \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build QAAdmin configuration (Simulator, admin variant)
        run: |
          xcodebuild \
            -project MochiAI.xcodeproj \
            -scheme MochiAIAdmin \
            -configuration QAAdmin \
            -sdk iphonesimulator \
            -derivedDataPath build-qa-admin \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Boot an iPhone 15 Pro Max simulator (pinned)
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.name | startswith("iOS")))] | last | .identifier')
          UDID=$(xcrun simctl list devices -j | jq -r --arg rt "$RUNTIME" '(.devices[$rt] // []) | map(select(.isAvailable and (.name == "iPhone 15 Pro Max"))) | last | .udid // empty')
          if [ -z "$UDID" ]; then
            DEVTYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name == "iPhone 15 Pro Max")] | last | .identifier')
            echo "Creating iPhone 15 Pro Max from type: $DEVTYPE on $RUNTIME"
            UDID=$(xcrun simctl create QA-15ProMax "$DEVTYPE" "$RUNTIME")
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "Device UDID: $UDID"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          # v2.4.0: Joel judges glass on his device in DARK mode —
          # every capture this round is taken in dark appearance
          # (the v2.3.0 light captures could not judge the glass).
          xcrun simctl ui "$UDID" appearance dark

      - name: Install and capture the full surface matrix
        run: |
          set -e
          mkdir -p shots
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false || true
          APP=$(find build-qa/Build/Products -name "MochiAI.app" -type d | head -1)
          ADMIN_APP=$(find build-qa-admin/Build/Products -name "MochiAI.app" -type d | head -1)
          echo "App: $APP"
          echo "Admin app: $ADMIN_APP"
          BUNDLE=dev.joe.mochiai
          ADMIN_BUNDLE=dev.joe.mochiai.admin

          fresh_install() {
            xcrun simctl uninstall "$UDID" "$BUNDLE" 2>/dev/null || true
            xcrun simctl install "$UDID" "$APP"
          }

          shot() {
            local name="$1"; shift
            xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$BUNDLE" "$@"
            sleep 4
            xcrun simctl io "$UDID" screenshot "shots/$name"
          }

          # 1) Invite gate: brand-new install, NO launch arguments —
          #    since v2.4.0 this IS the real first screen of the
          #    normal build (fresh installs are invite-gated).
          fresh_install
          xcrun simctl launch "$UDID" "$BUNDLE"
          sleep 4
          xcrun simctl io "$UDID" screenshot shots/gate.png

          # 1b) Onboarding: same fresh install, display-only QA gate
          #     bypass (-QAPreviewOnboarding, QA configuration only —
          #     nothing is redeemed or persisted).
          shot onboarding.png -QAPreviewOnboarding

          # 2) Send flow: the proven continuous sequence (do not split —
          #    the in-app QA script phases align with these sleeps).
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE" -UITestMode -QASendFlow
          sleep 4
          xcrun simctl io "$UDID" screenshot shots/chat.png
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/sendflow1.png
          sleep 5
          xcrun simctl io "$UDID" screenshot shots/sendflow2.png

          # 3) Seeded tab surfaces.
          shot feed.png    -UITestMode -QAStartTab 1
          shot ideas.png   -UITestMode -QAStartTab 2
          shot goals.png   -UITestMode -QAStartTab 3
          shot library.png -UITestMode -QAStartTab 4

          # 4) Real empty states (fresh install, profile-only seed).
          fresh_install
          shot chat-empty.png    -UITestMode -QAEmpty
          shot ideas-empty.png   -UITestMode -QAEmpty -QAStartTab 2
          shot goals-empty.png   -UITestMode -QAEmpty -QAStartTab 3
          shot library-empty.png -UITestMode -QAEmpty -QAStartTab 4

          # 5) Call screen surface (renders only; the controller never
          #    starts, so no microphone prompt and no network).
          fresh_install
          shot call.png -UITestMode -QACallPreview

          # 6) Admin build: Bibliothek with the Invite-Codes section,
          #    seeded locally via -QAAdminInvites (two sample codes —
          #    one open, one used; no network involved).
          xcrun simctl uninstall "$UDID" "$ADMIN_BUNDLE" 2>/dev/null || true
          xcrun simctl install "$UDID" "$ADMIN_APP"
          xcrun simctl terminate "$UDID" "$ADMIN_BUNDLE" 2>/dev/null || true
          sleep 1
          xcrun simctl launch "$UDID" "$ADMIN_BUNDLE" -UITestMode -QAAdminInvites -QAStartTab 4
          sleep 4
          xcrun simctl io "$UDID" screenshot shots/admin-invites.png

          ls -la shots

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mochi-qa-screenshot
          path: shots/
