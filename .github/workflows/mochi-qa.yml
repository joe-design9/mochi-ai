name: Mochi QA (Nova v3.0.0)

# QA screenshot workflow for Nova v3.0.0 — the v2.4.0 pattern,
# updated for the sidebar redesign and the proxy send flow.
#
# HOW TO RUN (owner): upload this file as
# .github/workflows/mochi-qa.yml, then dispatch it TWICE —
# run_label "run1" and "run2". BOTH runs must be fully green and
# every screenshot visually inspected before any release:
#   - iPhone 15 Pro Max pinned, DARK appearance set right after boot
#   - gate.png / onboarding.png are the REAL first screens of a
#     fresh install (no launch arguments)
#   - the send flow runs through the QA mock proxy (-QAProxyMock),
#     so the v3 proxy path (AppStore -> BackendAI) is exercised
#     end-to-end in CI without any secret or deployed function
#   - sidebar.png shows the opened v3 sidebar (TABS + Verläufe +
#     bottom search/compose/gear bar)
#   - library.png (normal build) must show NO API-key UI — the
#     "Nova Cloud aktiv" status card instead; the admin capture
#     keeps the invite section leading the Bibliothek
#
# Delete the workflow file again after the release round, as before.

on:
  workflow_dispatch:
    inputs:
      run_label:
        description: "Run label (run1 / run2) — used in the artifact name"
        required: true
        default: "run1"

jobs:
  qa-screenshots:
    runs-on: macos-26
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create + boot iPhone 15 Pro Max (dark)
        run: |
          set -euo pipefail
          RUNTIME=$(xcrun simctl list runtimes -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          ios=[r for r in data["runtimes"] if r.get("isAvailable") and r["name"].startswith("iOS")]
          ios.sort(key=lambda r: r["version"])
          print(ios[-1]["identifier"])')
          echo "Runtime: $RUNTIME"
          UDID=$(xcrun simctl list devices -j | python3 -c '
          import json,sys
          data=json.load(sys.stdin)
          for devices in data["devices"].values():
              for d in devices:
                  if d.get("isAvailable") and "15 Pro Max" in d["name"]:
                      print(d["udid"]); raise SystemExit
          ' || true)
          if [ -z "${UDID:-}" ]; then
            UDID=$(xcrun simctl create "QA iPhone 15 Pro Max" \
              "com.apple.CoreSimulator.SimDeviceType.iPhone-15-Pro-Max" "$RUNTIME")
          fi
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          # Software keyboard (host-side simulator preference) and
          # DARK appearance immediately after boot — every capture in
          # this matrix is judged in dark mode only.
          defaults write com.apple.iphonesimulator ConnectHardwareKeyboard -bool false
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl ui "$UDID" appearance dark

      - name: Build QA (normal) + QAAdmin
        run: |
          set -euo pipefail
          xcodebuild -project MochiAI.xcodeproj -scheme MochiAI \
            -configuration QA -sdk iphonesimulator \
            -derivedDataPath "$PWD/build-qa" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build
          xcodebuild -project MochiAI.xcodeproj -scheme MochiAIAdmin \
            -configuration QAAdmin -sdk iphonesimulator \
            -derivedDataPath "$PWD/build-qa-admin" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Capture matrix
        run: |
          set -euo pipefail
          mkdir -p out
          APP="build-qa/Build/Products/QA-iphonesimulator/MochiAI.app"
          ADMIN_APP="build-qa-admin/Build/Products/QAAdmin-iphonesimulator/MochiAI.app"
          BUNDLE="dev.joe.mochiai"
          ADMIN_BUNDLE="dev.joe.mochiai.admin"

          shot() { # shot <file> <sleep> <bundle> [launch args...]
            local file="$1"; local wait_s="$2"; local bundle="$3"; shift 3
            xcrun simctl terminate "$UDID" "$bundle" 2>/dev/null || true
            sleep 1
            xcrun simctl launch "$UDID" "$bundle" "$@"
            sleep "$wait_s"
            xcrun simctl io "$UDID" screenshot "out/$file"
          }

          # --- Real first screens: FRESH install, no arguments.
          xcrun simctl uninstall "$UDID" "$BUNDLE" 2>/dev/null || true
          xcrun simctl install "$UDID" "$APP"
          shot gate.png 5 "$BUNDLE"
          # Same install: onboarding via the display-only QA bypass.
          shot onboarding.png 4 "$BUNDLE" -QAPreviewOnboarding

          # --- Chat + send flow through the mock proxy. Timings ride
          # the in-app QA script (badge shows phase/focus/msgs).
          xcrun simctl terminate "$UDID" "$BUNDLE" 2>/dev/null || true
          sleep 1
          xcrun simctl launch "$UDID" "$BUNDLE" -UITestMode -QASendFlow -QAProxyMock
          sleep 4;  xcrun simctl io "$UDID" screenshot out/chat.png
          sleep 7;  xcrun simctl io "$UDID" screenshot out/sendflow1.png
          sleep 6;  xcrun simctl io "$UDID" screenshot out/sendflow2.png

          # --- The v3 sidebar, opened.
          shot sidebar.png 4 "$BUNDLE" -UITestMode -QASidebar

          # --- Sections (sidebar closed; -QAStartTab picks the tab).
          shot feed.png    4 "$BUNDLE" -UITestMode -QAStartTab 1
          shot ideas.png   4 "$BUNDLE" -UITestMode -QAStartTab 2
          shot goals.png   4 "$BUNDLE" -UITestMode -QAStartTab 3
          shot library.png 4 "$BUNDLE" -UITestMode -QAStartTab 4

          # --- Real empty states.
          shot chat-empty.png    4 "$BUNDLE" -UITestMode -QAEmpty
          shot ideas-empty.png   4 "$BUNDLE" -UITestMode -QAEmpty -QAStartTab 2
          shot goals-empty.png   4 "$BUNDLE" -UITestMode -QAEmpty -QAStartTab 3
          shot library-empty.png 4 "$BUNDLE" -UITestMode -QAEmpty -QAStartTab 4

          # --- Call screen (renders only; no mic prompt, no network).
          shot call.png 5 "$BUNDLE" -UITestMode -QACallPreview

          # --- Admin build: invite codes lead the Bibliothek.
          xcrun simctl uninstall "$UDID" "$ADMIN_BUNDLE" 2>/dev/null || true
          xcrun simctl install "$UDID" "$ADMIN_APP"
          shot admin-invites.png 5 "$ADMIN_BUNDLE" -UITestMode -QAAdminInvites -QAStartTab 4

          # Green means COMPLETE: every expected capture exists and
          # is non-empty. (Visual inspection happens on the artifact.)
          for f in gate onboarding chat sendflow1 sendflow2 sidebar \
                   feed ideas goals library chat-empty ideas-empty \
                   goals-empty library-empty call admin-invites; do
            test -s "out/$f.png" || { echo "MISSING capture: $f.png"; exit 1; }
          done
          ls -la out

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: qa-screenshots-${{ inputs.run_label }}
          path: out/*.png
          if-no-files-found: error
