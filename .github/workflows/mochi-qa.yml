name: QA Screenshot

on:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build QA configuration (Simulator)
        run: |
          xcodebuild \
            -project MochiAI.xcodeproj \
            -scheme MochiAI \
            -configuration QA \
            -sdk iphonesimulator \
            -derivedDataPath build-qa \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Boot a simulator
        run: |
          RUNTIME=$(xcrun simctl list runtimes -j | jq -r '[.runtimes[] | select(.isAvailable and (.name | startswith("iOS")))] | last | .identifier')
          DEVTYPE=$(xcrun simctl list devicetypes -j | jq -r '[.devicetypes[] | select(.name | startswith("iPhone"))] | last | .identifier')
          echo "Runtime: $RUNTIME  DeviceType: $DEVTYPE"
          UDID=$(xcrun simctl create MochiQA "$DEVTYPE" "$RUNTIME")
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b

      - name: Install and capture
        run: |
          mkdir -p shots
          APP=$(find build-qa/Build/Products -name "MochiAI.app" -type d | head -1)
          echo "App: $APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" dev.joe.mochiai -UITestMode
          sleep 6
          xcrun simctl io "$UDID" screenshot shots/chat.png
          ls -la shots

      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: mochi-qa-screenshot
          path: shots/
