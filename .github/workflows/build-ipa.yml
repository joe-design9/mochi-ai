name: Build IPA

on:
  push:
    branches: [main]
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build app (unsigned)
        run: |
          xcodebuild \
            -project MochiAI.xcodeproj \
            -scheme MochiAI \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Build admin app (unsigned)
        run: xcodebuild -project MochiAI.xcodeproj -scheme MochiAIAdmin -configuration ReleaseAdmin -sdk iphoneos -derivedDataPath "$PWD/build-admin" CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Package IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/MochiAI.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Built app not found at $APP_PATH"
            find build -name "*.app" -maxdepth 5
            exit 1
          fi
          VERSION=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "$APP_PATH/Info.plist")
          IPA_NAME="MochiAI-${VERSION}.ipa"
          echo "IPA_NAME=$IPA_NAME" >> "$GITHUB_ENV"
          rm -rf Payload "$IPA_NAME"
          mkdir Payload
          cp -R "$APP_PATH" Payload/
          zip -qry "$IPA_NAME" Payload
          ls -lh "$IPA_NAME"
          ADMIN_APP_PATH="build-admin/Build/Products/ReleaseAdmin-iphoneos/MochiAI.app"
          if [ ! -d "$ADMIN_APP_PATH" ]; then echo "Built admin app not found at $ADMIN_APP_PATH"; find build-admin -name "*.app" -maxdepth 5; exit 1; fi
          ADMIN_IPA_NAME="MochiAI-Admin-${VERSION}.ipa"
          echo "ADMIN_IPA_NAME=$ADMIN_IPA_NAME" >> "$GITHUB_ENV"
          rm -rf Payload "$ADMIN_IPA_NAME"
          mkdir Payload
          cp -R "$ADMIN_APP_PATH" Payload/
          zip -qry "$ADMIN_IPA_NAME" Payload
          ls -lh "$ADMIN_IPA_NAME"

      - name: Upload IPA as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: MochiAI-ipa
          path: |
            ${{ env.IPA_NAME }}
            ${{ env.ADMIN_IPA_NAME }}
          if-no-files-found: error

      - name: Attach IPA to the GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.IPA_NAME }}
            ${{ env.ADMIN_IPA_NAME }}
